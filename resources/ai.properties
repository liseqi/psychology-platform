# =====================================================
# AI大模型配置 - 心理咨询智能助手 V3.0
# 支持多模型切换：豆包(字节跳动) / DeepSeek / OpenAI
# =====================================================

# ---- 当前使用的AI提供商 (可选值: DOUBAO/DEEPSEEK/OPENAI/CUSTOM) ----
ai.provider=DOUBAO

# ---- 豆包(字节跳动) 配置 ----
ai.doubao.api.url=https://ark.cn-beijing.volces.com/api/v3/chat/completions
ai.doubao.api.key=ark-edfcafdb-4746-4fe9-9e65-e32a497d3be1-f82e9
ai.doubao.model=doubao-seed-2-1-pro-260628
ai.doubao.max.tokens=2048
ai.doubao.temperature=0.7
ai.doubao.top.p=0.9
ai.doubao.embedding.url=https://ark.cn-beijing.volces.com/api/v3/embeddings
ai.doubao.embedding.model=

# ---- DeepSeek 配置 ----
ai.deepseek.api.url=https://api.deepseek.com/chat/completions
ai.deepseek.api.key=your_deepseek_api_key_here
ai.deepseek.model=deepseek-chat
ai.deepseek.max.tokens=2048
ai.deepseek.temperature=0.7
ai.deepseek.top.p=1.0

# ---- OpenAI 兼容接口（通用） ----
ai.openai.api.url=https://api.openai.com/v1/chat/completions
ai.openai.api.key=your_openai_api_key_here
ai.openai.model=gpt-4o-mini
ai.openai.max.tokens=2048
ai.openai.temperature=0.7

# ---- 自定义OpenAI兼容API（如Ollama本地部署等）----
ai.custom.api.url=http://localhost:11434/v1/chat/completions
ai.custom.api.key=ollama
ai.custom.model=qwen2.5:7b-instruct
ai.custom.max.tokens=2048
ai.custom.temperature=0.7

# ---- 通用设置 ----
ai.request.timeout.seconds=30
ai.stream.enabled=true
ai.context.window.size=10
ai.max.history.days=30

# ---- 心理咨询场景专用配置 ----
psychology.crisis.keywords=suicide,death,self-harm,depression,anxiety
psychology.crisis.hotline=400-161-9995
psychology.crisis.center.name=School Counseling Center
psychology.crisis.center.phone=Please replace with actual number

# ---- 数据增强开关 ----
data.enhancement.student.profile=true
data.enhancement.assessment.history=true
data.enhancement.consultation.history=true
data.enhancement.appointment.info=true

# =====================================================
# V3.0新增：向量数据库配置
# =====================================================
vector.db.type=MYSQL

# Milvus配置（仅当vector.db.type=MILVUS时生效）
milvus.host=localhost
milvus.port=19530
milvus.collection.name=psychology_articles

# Pinecone配置（仅当vector.db.type=PINECONE时生效）
pinecone.api.key=
pinecone.environment=
pinecone.index.name=psychology-kb

# =====================================================
# V3.0新增：Embedding（文本向量化）配置
# =====================================================
embedding.provider=DOUBAO
embedding.model=text-embedding-v1
embedding.dimension=768
embedding.api.key=

# =====================================================
# V3.0新增：RAG检索增强生成配置
# =====================================================
rag.enabled=true
rag.top_k=3
rag.similarity_threshold=0.6
rag.max.context.length=1500

# RAG触发关键词
rag.trigger.keywords=what is,how to,symptoms,treatment,method,anxiety,depression,insomnia,pressure,trauma,PTSD,ADHD,self-regulation,relaxation,meditation,breathing,CBT,counseling,psychotherapy

# =====================================================
# V3.0新增：长期记忆持久化配置
# =====================================================
memory.enabled=true
memory.max.per.user=100
memory.auto.extract=true
memory.confidence.threshold=0.70
memory.expiration.days=180

# =====================================================
# 数据库连接配置（用于VectorStore和MemoryService）
# =====================================================
database.url=jdbc:mysql://localhost:3306/psychology?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
database.username=root
database.password=123456
